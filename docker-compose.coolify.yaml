# Coolify deployment compose for the eve-helion project.
#
# NOT a standalone `docker compose up` file:
#   - env vars are injected by Coolify (defined in the Coolify UI, substituted below);
#   - the web domain (helion.entropiadev.com) is set in the Coolify UI, which wires the
#     Traefik labels + attaches coolify-proxy — we don't hand-write proxy labels here;
#   - Postgres/Redis are separate Coolify-managed resources (eve-postgres / helion-redis),
#     reached via DATABASE_URL / REDIS_URL — they are NOT defined in this file.
#   - `exclude_from_hc` is a Coolify-specific field (preprocessed by Coolify, stripped before
#     `docker compose`); it is NOT valid standalone compose.
# Point Coolify's "Docker Compose Location" at this file.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &app-env
    DEBUG: ${DEBUG}
    SECRET_KEY: ${SECRET_KEY}
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    ESI_CLIENT_ID: ${ESI_CLIENT_ID}
    ESI_CLIENT_SECRET: ${ESI_CLIENT_SECRET}
    ESI_CLIENT_SCOPE: ${ESI_CLIENT_SCOPE}
    ESI_CLIENT_CALLBACK_URL: ${ESI_CLIENT_CALLBACK_URL}
    ESI_CLIENT_USER_AGENT: ${ESI_CLIENT_USER_AGENT}
    ESI_USER_CONTACT_EMAIL: ${ESI_USER_CONTACT_EMAIL}
    CELERY_BEAT_SCHEDULER: ${CELERY_BEAT_SCHEDULER}

services:
  web:
    <<: *app
    # migrate + sync_market_views at the front of the command (Coolify rejects compose-5.3
    # pre_start; its pre-deploy command no-ops for compose). sync_market_views recreates the
    # orders_hub view and therefore needs the externally-owned market schema: a cluster
    # without it fails here, loudly, at startup. gunicorn binds only after both steps, so the
    # healthcheck below (HTTP GET /healthz/ -> 200) is also a "migrations + view done" signal
    # that worker/beat gate on.
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py sync_market_views && exec gunicorn helion.wsgi --bind 0.0.0.0:8000 --timeout 600 --log-file -"]
    # HTTP check via python (no curl/wget in slim). Host header set so Django ALLOWED_HOSTS
    # returns 200 instead of 400; urlopen raises (non-zero exit) on any non-2xx.
    # /healthz/ answers 503 when Postgres or Redis does not answer, so this check covers
    # the datastores too - it marks the container unhealthy on a datastore outage.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz/', headers={'Host': 'helion.entropiadev.com'}), timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    expose:
      - "8000"

  worker:
    <<: *app
    exclude_from_hc: true
    depends_on:
      web:
        condition: service_healthy
    command: celery -A helion worker --loglevel=info

  beat:
    <<: *app
    exclude_from_hc: true
    depends_on:
      web:
        condition: service_healthy
    command: celery -A helion beat --loglevel=info
