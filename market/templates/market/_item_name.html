<a class="item-name-link" data-type-id="{{ type_id }}" href="#">{{ item_name }}</a>
{% if show_history %}
 <a href="{{ history_url }}"><i class="bi bi-bar-chart-line"></i></a>
{% endif %}
{% if show_add_del %}
 {% if is_trade_item %}
 <div class="minus-icon" alt="Remove from trade items"></div>
 {% else %}
 <div class="plus-icon" alt="Add to trade items"></div>
 {% endif %}
 <div class="loading-spinner" style="display:none"><div class="css-spinner"></div></div>
{% endif %}
